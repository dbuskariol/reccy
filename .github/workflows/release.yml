name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/reccy-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "RECCY_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "RECCY_SIGNING_CERTIFICATE=$CERTIFICATE" >> "$GITHUB_ENV"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/Developer ID Application/{print $2; exit}')"
          test -n "$SIGNING_IDENTITY"
          echo "RECCY_CODESIGN_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Materialize private release keys
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          SPARKLE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8"
          printf '%s' "$SPARKLE_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/reccy-sparkle-key"
          chmod 600 "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/reccy-sparkle-key"

      - name: Build, notarize, and verify release
        env:
          RECCY_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
          RECCY_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          RECCY_NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          RECCY_NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          RECCY_SPARKLE_PRIVATE_KEY_FILE: ${{ runner.temp }}/reccy-sparkle-key
          RECCY_GITHUB_REPOSITORY: ${{ github.repository }}
          RECCY_RELEASE_TAG: ${{ github.ref_name }}
        run: Scripts/release.sh finalize

      - name: Preserve release evidence and debug symbols
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reccy-${{ github.ref_name }}-release-evidence
          if-no-files-found: error
          retention-days: 90
          path: |
            dist/notarization/*.json
            dist/symbols/*.zip
            dist/updates/release.json
            dist/updates/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/updates/appcast.xml \
            dist/updates/Reccy-*.zip \
            dist/updates/Reccy-*.md \
            dist/updates/release.json \
            dist/updates/SHA256SUMS \
            --title "Reccy ${GITHUB_REF_NAME#v}" \
            --notes-file Documentation/RELEASE_NOTES.md \
            --verify-tag \
            --latest

      - name: Remove release credentials
        if: always()
        run: |
          if [[ -n "${RECCY_SIGNING_KEYCHAIN:-}" ]]; then
            security delete-keychain "$RECCY_SIGNING_KEYCHAIN" || true
          fi
          rm -f \
            "${RECCY_SIGNING_CERTIFICATE:-}" \
            "$RUNNER_TEMP"/AuthKey_*.p8 \
            "$RUNNER_TEMP/reccy-sparkle-key"
